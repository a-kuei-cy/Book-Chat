<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>興嘉國小班級聊書時光</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    /* * 色彩計畫 (擷取自興嘉國小水彩畫與學童插畫)
     * Primary: 湖水綠 (取自校舍)
     * Secondary: 晴空藍 (取自天空與制服)
     * Accent: 暖橘黃 (取自活力配件)
     */
    :root {
      --primary-color: #3AA39F; 
      --secondary-color: #4facfe;
      --accent-color: #FFB74D;
      --bg-color: #F4F9F9;
      --text-main: #2C3E50;
    }

    body { 
      font-family: 'Noto Sans TC', sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main);
    }

    /* 頂部英雄區塊 - 湖水綠到晴空藍的漸層 */
    .hero-section {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: white; 
      padding: 50px 0; 
      margin-bottom: 40px;
      border-radius: 0 0 30px 30px; 
      box-shadow: 0 10px 25px rgba(58, 163, 159, 0.2);
      position: relative;
      overflow: hidden;
    }
    
    /* 增加一點背景圖騰感 (圓圈裝飾) */
    .hero-section::before {
      content: '';
      position: absolute;
      top: -50px; right: -50px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }
    .hero-section::after {
      content: '';
      position: absolute;
      bottom: -30px; left: 10%;
      width: 100px; height: 100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }

    /* 數字統計卡片 - 玻璃擬物風格 */
    .stat-card {
      background: rgba(255, 255, 255, 0.25); 
      border-radius: 20px;
      padding: 15px; 
      backdrop-filter: blur(10px); 
      border: 1px solid rgba(255,255,255,0.4);
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .stat-number { 
      font-size: 3rem; 
      font-weight: 800; 
      font-family: 'Nunito', sans-serif;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    /* 標籤導航美化 */
    .nav-pills .nav-link { 
      color: var(--primary-color); 
      font-weight: 700; 
      border-radius: 25px;
      padding: 10px 25px;
      margin: 0 5px;
      transition: all 0.3s ease;
    }
    .nav-pills .nav-link.active { 
      background-color: var(--primary-color); 
      box-shadow: 0 4px 10px rgba(58, 163, 159, 0.3);
    }
    .nav-pills .nav-link:hover:not(.active) {
      background-color: rgba(58, 163, 159, 0.1);
    }

    /* 卡片設計 - 更圓潤、陰影更柔和 */
    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.04);
    }
    .result-card {
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .result-card:hover { 
      transform: translateY(-8px); 
      box-shadow: 0 15px 30px rgba(58, 163, 159, 0.15); 
    }
    .card-img-top { 
      height: 220px; 
      object-fit: cover; 
      border-radius: 20px 20px 0 0;
    }
    
    /* 按鈕與徽章美化 */
    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      border-radius: 25px;
      font-weight: bold;
    }
    .btn-primary:hover {
      background-color: #2F8A86;
      border-color: #2F8A86;
    }
    .badge.bg-light.text-dark {
      background-color: #E8F5F5 !important;
      color: var(--primary-color) !important;
      border: 1px solid rgba(58,163,159,0.2);
    }
    
    .text-primary { color: var(--primary-color) !important; }
    .text-truncate-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .admin-section { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.04); }
    .badge-method { cursor: pointer; margin-right: 8px; margin-bottom: 8px; display: inline-block; padding: 10px 15px; font-size: 0.9em; border-radius: 15px;}
    .badge-method:hover { opacity: 0.8; transform: scale(1.05); transition: 0.2s;}
    
    .chart-container { position: relative; height: 160px; width: 100%; }
    
    /* 載入動畫 */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.9); z-index: 9999;
      display: none; justify-content: center; align-items: center;
    }
    .spinner-border { color: var(--primary-color) !important; }

    /* 確保 Logo 在黑色背景下有好的對比，加入一點外發光效果 (選用) */
    .school-logo {
      height: 55px; 
      margin-right: 15px;
      border-radius: 8px;
    }
  </style>
  <meta name="description" content="興嘉國小班級聊書時光：分享閱讀成果，交流課堂上的閱讀風景。">
  <meta name="theme-color" content="#24645b">
  <link rel="stylesheet" href="enhancements.css">
</head>
<body>
<a class="skip-link" href="#mainContent">跳至主要內容</a>

  <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite" aria-label="資料處理中，請稍候">
    <div class="spinner-border" role="status" style="width: 3rem; height: 3rem;"></div>
  </div>

  <div class="hero-section">
    <div class="container position-relative" style="z-index: 1;">
      <div class="row align-items-center">
        <!-- 標題區塊 -->
        <div class="col-lg-5 mb-4 mb-lg-0 text-center text-lg-start">
          <div class="d-flex align-items-center justify-content-center justify-content-lg-start mb-2">
            <!-- 替換為上傳的校徽 logo -->
            <span class="school-logo book-mark" aria-hidden="true">閱</span>
            <h1 class="display-5 fw-bold mb-0"><span class="school-name">興嘉國小</span>班級聊書時光</h1>
          </div>
          <!-- 修正英文校名拼音 -->
          <p class="lead mb-0 opacity-75" style="font-family: 'Nunito', sans-serif; padding-left: 70px;">一本書，一場對話，一起看見孩子的成長。</p>
        </div>
        
        <!-- 統計區塊 (圓餅圖) -->
        <div class="col-lg-7">
          <div class="row g-3">
            <div class="col-md-4 col-6">
              <div class="stat-card h-100 d-flex flex-column justify-content-center">
                <div class="mb-1 fw-bold">參與班級數</div>
                <div class="stat-number" id="classCount">—</div>
              </div>
            </div>
            <div class="col-md-8 col-12">
              <div class="stat-card h-100 d-flex flex-column justify-content-center">
                <div class="chart-container">
                  <canvas id="gradePieChart" role="img" aria-label="各年級參與班級分布" aria-describedby="chartSummary"></canvas><p id="chartSummary" class="chart-summary">正在載入年級分布</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="container pb-5" id="mainContent">
<div id="connectionStatus" class="connection-status" role="status" aria-live="polite">正在取得閱讀成果…</div>
    <ul class="nav nav-pills mb-4 justify-content-center" id="pills-tab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="pills-upload-tab" role="tab" aria-controls="pills-upload" aria-selected="true" data-bs-toggle="pill" data-bs-target="#pills-upload">
          <i class="bi bi-cloud-upload-fill me-1"></i> 導師上傳區
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="pills-gallery-tab" role="tab" aria-controls="pills-gallery" aria-selected="false" data-bs-toggle="pill" data-bs-target="#pills-gallery">
          <i class="bi bi-images me-1"></i> 成果觀摩牆
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="pills-admin-tab" role="tab" aria-controls="pills-admin" aria-selected="false" data-bs-toggle="pill" data-bs-target="#pills-admin">
          <i class="bi bi-gear-fill me-1"></i> 管理員專區
        </button>
      </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
      <!-- 上傳區 -->
      <div class="tab-pane fade show active" id="pills-upload" role="tabpanel" aria-labelledby="pills-upload-tab" tabindex="0">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card shadow-sm border-0">
              <div class="card-body p-4 p-md-5">
                <h4 class="card-title mb-4 text-center text-primary fw-bold">記錄一段閱讀時光</h4><p class="form-intro">分享班上的好書與對話，讓教學靈感繼續傳遞。<br><small>標示 * 為必填，學習單可選填。</small></p>
                <form id="uploadForm">
                  <div class="row mb-3">
                    <div class="col-md-6">
                      <label class="form-label fw-bold" for="className">班級 <span class="text-danger">*</span></label><input type="text" class="form-control form-control-lg" id="className" placeholder="例：601 或 六年一班" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label fw-bold" for="date">實施日期 <span class="text-danger">*</span></label><input type="date" class="form-control form-control-lg" id="date" required>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold" for="method">實施方式 <span class="text-danger">*</span></label><select class="form-select form-select-lg" id="method" required>
                      <option value="" disabled selected>載入中...</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold" for="bookTitle">閱讀書目 <span class="text-danger">*</span></label><input type="text" class="form-control form-control-lg" id="bookTitle" placeholder="這次一起讀了哪一本書？" maxlength="200" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold" for="content">聊書內容簡述 <span class="text-danger">*</span></label><textarea class="form-control" id="content" rows="5" placeholder="聊了哪些問題？孩子有什麼有趣的想法或發現？" maxlength="5000" required></textarea>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold" for="photoFile">成果照片 <span class="text-danger">*</span> <small class="text-muted fw-normal">(5MB以內)</small></label><input class="form-control form-control-lg" type="file" id="photoFile" accept="image/jpeg,image/png,image/webp,image/gif" required aria-describedby="photoHelp">
                  </div>
                  <p id="photoHelp" class="small text-muted">支援 JPG、PNG、WebP、GIF，單檔上限 5MB。</p><div id="photoPreview" class="photo-preview" hidden><img alt="待上傳成果照片預覽"><span></span></div>
                  <div class="mb-4">
                    <label class="form-label fw-bold" for="worksheetFile">學習單 <small class="text-muted fw-normal">(選填，PDF 或圖片，5MB 以內)</small></label><input class="form-control form-control-lg" type="file" id="worksheetFile" accept=".pdf,image/*">
                  </div>
                  <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill py-3">確認送出成果</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 成果牆區 -->
      <div class="tab-pane fade" id="pills-gallery" role="tabpanel" aria-labelledby="pills-gallery-tab" tabindex="0">
        <div class="gallery-heading"><div><p class="eyebrow">READ · SHARE · GROW</p><h2>每個班級，都有好故事</h2><p>尋找一本好書，也尋找下一次聊書的靈感。</p></div><button class="btn btn-outline-secondary" type="button" id="refreshGallery">重新整理</button></div>
<div class="gallery-tools"><div><label for="gallerySearch">搜尋成果</label><input id="gallerySearch" class="form-control" type="search" placeholder="輸入班級、書名或內容"></div><div><label for="galleryMethod">實施方式</label><select id="galleryMethod" class="form-select"><option value="">全部方式</option></select></div><div><label for="gallerySort">排序</label><select id="gallerySort" class="form-select"><option value="newest">實施日期：新到舊</option><option value="oldest">實施日期：舊到新</option></select></div></div>
<p id="galleryCount" class="text-muted small" role="status" aria-live="polite"></p><div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="galleryContainer" aria-busy="true"></div><div class="text-center mt-4"><button type="button" id="loadMore" class="btn btn-outline-primary" hidden>載入更多成果</button></div>
      </div>

      <!-- 管理員專區 -->
      <div class="tab-pane fade" id="pills-admin" role="tabpanel" aria-labelledby="pills-admin-tab" tabindex="0">
        <div id="adminLoginScreen" class="row justify-content-center mt-5">
          <div class="col-md-5">
            <div class="card shadow-sm border-0">
              <div class="card-body text-center p-5">
                <div class="mb-4 text-primary">
                  <i class="bi bi-shield-lock-fill" style="font-size: 3rem;"></i>
                </div>
                <h4 class="mb-4 fw-bold">管理員登入</h4>
                <input type="password" id="adminPassword" aria-label="管理員密碼" autocomplete="current-password" class="form-control form-control-lg mb-4 text-center" placeholder="請輸入密碼">
                <button class="btn btn-primary btn-lg w-100 rounded-pill" onclick="performLogin()">登入系統</button>
              </div>
            </div>
          </div>
        </div>

        <div id="adminPanel" style="display:none;">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0 fw-bold text-primary"><i class="bi bi-speedometer2 me-2"></i>後台管理系統</h4>
            <button class="btn btn-outline-secondary rounded-pill px-4" onclick="logout()">登出</button>
          </div>

          <div class="admin-section">
            <h5 class="border-bottom pb-3 mb-4 fw-bold"><i class="bi bi-tags-fill me-2 text-warning"></i>實施方式管理</h5>
            <div class="input-group mb-4">
              <input type="text" class="form-control form-control-lg" id="newMethodInput" aria-label="新的實施方式名稱" placeholder="輸入新的實施方式名稱">
              <button class="btn btn-primary px-4" type="button" onclick="handleAddMethod()"><i class="bi bi-plus-lg me-1"></i> 新增</button>
            </div>
            <div id="methodsListContainer"><span class="text-muted">載入中...</span></div>
          </div>
          
          <div class="admin-section">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h5 class="mb-0 fw-bold"><i class="bi bi-table me-2 text-info"></i>上傳資料列表</h5>
              <button class="btn btn-success rounded-pill px-3" onclick="exportToCSV()"><i class="bi bi-file-earmark-spreadsheet me-1"></i> 匯出 CSV</button>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle" id="adminTable">
                <thead class="table-light">
                  <tr>
                    <th>班級</th><th>日期</th><th>方式</th><th>書目</th><th>內容預覽</th><th>操作</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
<footer class="site-footer">興嘉國小 · 讓閱讀成為日常，讓分享連結彼此。</footer>
  <!-- 編輯 Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalTitle">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow" style="border-radius: 20px;">
        <div class="modal-header border-0 pb-0">
          <h5 id="editModalTitle" class="modal-title fw-bold text-primary">編輯資料</h5>
          <button type="button" class="btn-close" aria-label="關閉" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <input type="hidden" id="editRowIndex">
          <div class="mb-3"><label class="form-label fw-bold" for="editClass">班級</label><input type="text" class="form-control" id="editClass"></div>
          <div class="mb-3"><label class="form-label fw-bold" for="editDate">實施日期</label><input type="date" class="form-control" id="editDate"></div>
          <div class="mb-3">
            <label class="form-label fw-bold" for="editMethod">實施方式</label><select class="form-select" id="editMethod"></select>
          </div>
          <div class="mb-3"><label class="form-label fw-bold" for="editBook">書目</label><input type="text" class="form-control" id="editBook"></div>
          <div class="mb-3"><label class="form-label fw-bold" for="editContent">內容</label><textarea class="form-control" id="editContent" rows="4"></textarea></div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary rounded-pill px-4" onclick="submitEdit()">儲存變更</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="app.js" defer></script>
  <script src="enhancements.js" defer></script>

</body>
</html>
